<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>THE ERİNÇ — Beylerbeyi Savaşı</title><style>
*{box-sizing:border-box}body{margin:0;background:#100e1b;color:#fff;font-family:Inter,system-ui,Arial;overflow:hidden}canvas{display:block;touch-action:none}button,input{font:inherit}button{cursor:pointer}#overlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#3e284d 0,#0e0b18 70%);z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}#panel{width:min(560px,100%);border:1px solid #ffdd9b50;border-radius:28px;background:#1c1729e8;box-shadow:0 25px 90px #000b;padding:25px;text-align:center;backdrop-filter:blur(20px)}h1{font-size:clamp(30px,6vw,48px);margin:5px 0 0;color:#ffdb91;letter-spacing:-2px}#panel p{color:#b9aec8;margin:4px 0 22px}.skins{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:16px 0}.skins img{width:100%;aspect-ratio:1;border-radius:50%;border:3px solid transparent;object-fit:cover;cursor:pointer;transition:transform .2s,border .2s}.skins img:hover{transform:scale(1.08)}.skins img.active{border-color:#ffcf65;box-shadow:0 0 20px #ffc45880}input{width:100%;padding:14px;border:1px solid #756384;border-radius:13px;background:#100e19;color:#fff;outline:none;text-align:center;font-size:18px}#play{width:100%;margin-top:12px;padding:15px;border:0;border-radius:13px;font-weight:900;color:#241708;background:linear-gradient(110deg,#ffe19d,#f6a82f);font-size:18px}#msg{min-height:20px;margin-top:10px;color:#ffd48b;font-size:13px}#hud{position:fixed;left:16px;top:14px;pointer-events:none;text-shadow:0 2px 5px #000;z-index:2;font-weight:900}#board{position:fixed;right:14px;top:14px;padding:13px 17px;min-width:155px;border:1px solid #ffffff25;border-radius:16px;background:#161020b9;backdrop-filter:blur(10px);z-index:2;font-size:13px}#event{position:fixed;left:50%;transform:translateX(-50%);top:15px;padding:10px 20px;background:#e9a82b;color:#201406;border-radius:50px;font-weight:900;white-space:nowrap;z-index:2;box-shadow:0 4px 25px #f7bd4b55}#toast{position:fixed;top:75px;left:50%;transform:translateX(-50%);background:#251c34eb;padding:12px 20px;border:1px solid #ffe7a34d;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;z-index:5;max-width:90vw}#controls{position:fixed;right:16px;bottom:18px;display:flex;gap:12px;z-index:3}#controls button{border:1px solid #fff5;color:white;background:#241b36bb;border-radius:50%;width:65px;height:65px;font-weight:900;backdrop-filter:blur(8px)}#footer{position:fixed;left:14px;bottom:12px;font-size:11px;color:#b4a5c7;pointer-events:none}@media(max-width:650px){#board{font-size:11px;min-width:120px}#event{top:100px;font-size:11px;padding:8px}#controls button{width:57px;height:57px}.skins{gap:3px}#panel{padding:17px}}
</style></head><body><canvas id="game"></canvas><div id="hud">🥐 THE ERİNÇ <div id="stats" style="font-size:13px;font-weight:500">Bağlanılıyor...</div></div><div id="board">🏆 SIRALAMA</div><div id="event">🫒 SON POĞAÇA</div><div id="toast"></div><div id="footer">Fare / Dokun: Hareket • Space: Bölün • W: Kütle at</div><div id="controls"><button id="split">✂️</button><button id="eject">W</button></div><div id="overlay"><div id="panel"><div style="font-size:32px">🥐 👑 🫒</div><h1>THE ERİNÇ</h1><p>BEYLERBEYİ SAVAŞI · ONLINE</p><div style="font-size:13px;color:#b9aec8">Skinini seç. Son zeytinli poğaçayı kap.</div><div class="skins" id="skins"></div><input id="name" maxlength="18" placeholder="Savaşçı adın" autocomplete="off"><button id="play">⚔️ SAVAŞA GİR</button><div id="msg">5–10 kişilik sınıf savaşı</div></div></div>
<script>
// Render adresini yalnızca DirectAdmin'e yüklerken düzenle: örn. https://the-erinc-online.onrender.com
const SERVER_URL='';
const SKINS=['2CDFDBE3-AC79-4867-A383-1207E2386E40','4AADC346-66F8-4DFB-A163-EA2F9E62F7B5','8D7A611A-79CA-40F4-BC8F-ABE52EECF9A8','EB956F7A-46EC-458B-A7FE-33433A0379E8','83CFC748-3CC4-48C9-96FA-A28ACD24A35D','39B019DF-CC9C-4D3E-96DB-655D22302F8D'];
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const imgs=SKINS.map(s=>{let i=new Image();i.src='skins/'+s+'.jpeg';return i});let selected=0,ws=null,me=null,state={players:[],foods:[],projectiles:[],boosts:[],event:null,next:0},mouse={x:0,y:0},camera={x:1700,y:1700,z:1},name='',toastTimer=0,lastMove=0;
const $=id=>document.getElementById(id);SKINS.forEach((s,k)=>{let im=document.createElement('img');im.src='skins/'+s+'.jpeg';im.className=k===0?'active':'';im.onclick=()=>{selected=k;document.querySelectorAll('.skins img').forEach((x,i)=>x.classList.toggle('active',i===k))};$('skins').appendChild(im)});
function notice(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.opacity=0,3400)}
function connect(){name=$('name').value.trim()||'Oyuncu';$('msg').textContent='Sunucuya bağlanılıyor...';let target=SERVER_URL.trim()||location.origin;let url=target.replace(/^http/,'ws').replace(/\/$/,'');if(!/^wss?:\/\//.test(url)){ $('msg').textContent='Sunucu adresi hatalı';return}ws=new WebSocket(url);ws.onopen=()=>ws.send(JSON.stringify({type:'join',name,skin:selected}));ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='welcome'){me=m.id;$('overlay').style.display='none';notice('Beylerbeyi savaşına hoş geldin!')}if(m.type==='state')state=m;if(m.type==='notice')notice(m.message);if(m.type==='error'){$('msg').textContent=m.message;ws.close()}if(m.type==='dead'){me=null;$('overlay').style.display='flex';$('msg').textContent='💀 '+m.by+' seni yuttu! Tekrar gir.';ws.close()}};ws.onerror=()=>{$('msg').textContent='Sunucuya bağlanılamadı. Adresi kontrol et.'};ws.onclose=()=>{if(me!==null){me=null;$('overlay').style.display='flex';$('msg').textContent='Bağlantı kesildi. Tekrar giriş yap.'}}}
$('play').onclick=connect;$('name').onkeydown=e=>{if(e.key==='Enter')connect()};const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};$('split').onclick=()=>send({type:'split'});$('eject').onclick=()=>send({type:'eject'});window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();send({type:'split'})}if(e.key.toLowerCase()==='w')send({type:'eject'})});function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px'}addEventListener('resize',resize);resize();function aim(x,y){mouse.x=x-innerWidth/2;mouse.y=y-innerHeight/2}addEventListener('mousemove',e=>aim(e.clientX,e.clientY));canvas.addEventListener('touchstart',e=>{aim(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});canvas.addEventListener('touchmove',e=>{aim(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault()},{passive:false});
function circle(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}function draw(t){let w=innerWidth,h=innerHeight,dpr=devicePixelRatio;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);let player=state.players.find(p=>p.id===me);let pink=name==='kaptan'||name==='samet';ctx.fillStyle=pink?'#4a153f':'#100f1c';ctx.fillRect(0,0,w,h);if(player){let cx=player.parts.reduce((v,c)=>v+c.x*c.mass,0)/player.mass,cy=player.parts.reduce((v,c)=>v+c.y*c.mass,0)/player.mass;camera.x+=(cx-camera.x)*.12;camera.y+=(cy-camera.y)*.12;let zoom=Math.max(.35,Math.min(1.15,1.1/Math.pow(player.mass/65,.18)));camera.z+=(zoom-camera.z)*.07}ctx.save();ctx.translate(w/2,h/2);ctx.scale(camera.z,camera.z);ctx.translate(-camera.x,-camera.y);
ctx.strokeStyle=pink?'#ff82c321':'#c8a8ff17';ctx.lineWidth=1;let step=100;for(let x=0;x<=3400;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,3400);ctx.stroke()}for(let y=0;y<=3400;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(3400,y);ctx.stroke()}ctx.strokeStyle='#ffca6d77';ctx.lineWidth=9;ctx.strokeRect(0,0,3400,3400);
const colors=['#f5a63e','#ea5a84','#65e3c7','#8f8eff','#e9dd7d','#e49af9'];for(const f of state.foods)circle(f.x,f.y,5.5,colors[f.color%6]);for(const q of state.projectiles)circle(q.x,q.y,10,'#ffd36a');for(const b of state.boosts||[]){circle(b.x,b.y,24+Math.sin(t/180)*3,'#23e7ef55');ctx.font="28px serif";ctx.textAlign="center";ctx.fillText("⚡",b.x,b.y+10)}if(state.event){let {x,y}=state.event;let pulse=1+Math.sin(t/250)*.09;circle(x,y,55*pulse,'#ffca4a35');circle(x,y,34*pulse,'#ffce68');ctx.font='45px serif';ctx.textAlign='center';ctx.fillText('🥐',x,y+16)}
for(const p of [...state.players].sort((a,b)=>b.mass-a.mass)){for(const part of p.parts){let r=Math.sqrt(part.mass)*3.4;ctx.save();let rgb=p.name==='umutsiker',hue=(t/7)%360;ctx.shadowBlur=rgb?35:24;ctx.shadowColor=rgb?`hsl(${hue},100%,60%)`:p.id===me?'#ffd06d':'#fffd';circle(part.x,part.y,r+5,rgb?`hsl(${hue},100%,60%)`:p.id===me?'#ffe0a2':'#ffffffbb');ctx.shadowBlur=0;ctx.beginPath();ctx.arc(part.x,part.y,r,0,Math.PI*2);ctx.clip();if(p.name==='kaptan'||p.name==='samet'){let cols=['#e64146','#ff953b','#ffe44a','#43bd65','#4089e8','#a653c9'];cols.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(part.x-r,part.y-r+2*r*i/6,2*r,2*r/6+1)})}else if(imgs[p.skin]?.complete&&imgs[p.skin].naturalWidth){ctx.drawImage(imgs[p.skin],part.x-r,part.y-r,2*r,2*r)}else circle(part.x,part.y,r,'#9b6fe8');ctx.restore();ctx.textAlign='center';ctx.font='800 '+Math.max(13,Math.min(23,r/2.5))+'px system-ui';ctx.lineWidth=4;ctx.strokeStyle='#100d19';ctx.strokeText(p.name,part.x,part.y+r+23);ctx.fillStyle='#fff';ctx.fillText(p.name,part.x,part.y+r+23);if(p.boosted){ctx.font='bold 18px system-ui';ctx.fillStyle='#66ffff';ctx.fillText('⚡ 2X HIZ',part.x,part.y-r-18)}if(state.champion?.id===p.id){ctx.font='bold 17px system-ui';ctx.fillStyle='#ffd36a';ctx.fillText('👑 BEYLERBEYİ’NİN SAHİBİ',part.x,part.y-r-36)}}}ctx.restore();
let top=[...state.players].sort((a,b)=>b.mass-a.mass);$('board').innerHTML='🏆 <b>SIRALAMA</b><div style="margin-top:9px">'+top.slice(0,10).map((p,i)=>'<div style="padding:3px 0;color:'+(p.id===me?'#ffd36a':'#eee')+'">'+(i+1)+'. '+escapeHTML(p.name)+' <b>'+p.mass+'</b></div>').join('')+'</div>';$('stats').textContent='Kütle: '+(player?.mass||0)+' / 50.000'+' · Oyuncu: '+state.players.length+' / 14';$('event').textContent=state.event?'🥐 SON POĞAÇA HARİTADA!':state.champion?'👑 Av başladı: '+state.champion.remaining+' sn':'🫒 Son poğaça: '+Math.floor(state.next/60)+':'+String(state.next%60).padStart(2,'0');if(me!==null&&t-lastMove>50){let d=Math.hypot(mouse.x,mouse.y);send({type:'move',x:d>12?mouse.x/d:0,y:d>12?mouse.y/d:0});lastMove=t}requestAnimationFrame(draw)}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}requestAnimationFrame(draw);
</script></body></html>
