[pytest]
testpaths = tests
markers =
    fake_llm: Gerçek model yerine tests/conftest.py içindeki FakeProvider kullanır. Model/API entegrasyonunu DOĞRULAMAZ.
    sdk_http: Gerçek anthropic SDK / httpx2 istemcisi, sahte HTTP katmanı (MockTransport). İstek/yanıt biçimini doğrular, ağa çıkmaz.
    no_llm: Model katmanını hiç kullanmaz (auth, DB, hafıza, onay, fiyat hesabı).
    live: GERÇEK ücretli API çağrısı. Varsayılan olarak atlanır; BULUT_LIVE_TESTS=1 ve API anahtarı gerekir.
